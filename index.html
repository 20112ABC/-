<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="오늘의 별자리 운세">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 별자리 운세</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #FFF9F2 0%, #FDF2F5 50%, #F3F0FA 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --primary: #FF9EBB;
      --primary-hover: #FF85A9;
      --secondary: #B8B5FF;
      --secondary-hover: #A39FFF;
      --accent-cream: #FFF5E4;
      --text-main: #4A404F;
      --text-sub: #7D7083;
      --shadow-soft: 0 12px 32px rgba(180, 150, 175, 0.18);
      --border-soft: 2px solid #F7E6EC;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Gowun Dodum', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      line-height: 1.7;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 32px;
      padding: 32px 26px;
      box-shadow: var(--shadow-soft);
      border: var(--border-soft);
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
      animation: fadeIn 0.4s ease;
    }

    .header-emoji {
      font-size: 52px;
      text-align: center;
      margin-bottom: 10px;
      animation: float 3s ease-in-out infinite;
    }

    h1, h2, .cute-title {
      font-family: 'Jua', sans-serif;
      font-weight: 400;
      color: #5A4963;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-sub);
      font-size: 15px;
      margin-bottom: 26px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-label {
      display: block;
      font-family: 'Jua', sans-serif;
      font-size: 17px;
      color: #6B5876;
      margin-bottom: 8px;
      padding-left: 4px;
    }

    .text-input, .select-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 20px;
      border: 2px solid #F2DCE4;
      background: #FFFDFB;
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 16px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .text-input:focus, .select-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(255, 158, 187, 0.2);
    }

    .date-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .error-msg {
      color: #E06D8B;
      font-size: 14px;
      text-align: center;
      min-height: 22px;
      margin-bottom: 10px;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 24px;
      background: linear-gradient(135deg, #FFA6C1 0%, #FF8FB1 100%);
      color: white;
      font-family: 'Jua', sans-serif;
      font-size: 21px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 143, 177, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(255, 143, 177, 0.45);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* Screen 2: Zodiac Result */
    .zodiac-badge {
      display: inline-block;
      background: #FFF0F5;
      color: #D96B8A;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .zodiac-card {
      background: #FFFDF9;
      border: 2px solid #F7E8EE;
      border-radius: 26px;
      padding: 24px 20px;
      text-align: center;
      margin-bottom: 22px;
    }

    .zodiac-symbol {
      font-size: 64px;
      margin-bottom: 6px;
      display: block;
      animation: float 3s ease-in-out infinite;
    }

    .zodiac-name {
      font-family: 'Jua', sans-serif;
      font-size: 26px;
      color: #5A4963;
      margin-bottom: 4px;
    }

    .zodiac-date {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 14px;
    }

    .trait-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .trait-tag {
      background: #F4F1FF;
      color: #776BB3;
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 13px;
    }

    .zodiac-desc {
      font-size: 15.5px;
      color: #554A5C;
      text-align: left;
      background: #FFF7FA;
      padding: 16px;
      border-radius: 18px;
      line-height: 1.75;
    }

    .btn-fortune-big {
      width: 100%;
      padding: 20px;
      border: 3px solid #FFE0EA;
      border-radius: 28px;
      background: linear-gradient(135deg, #FF9EBB 0%, #FFB5C8 100%);
      color: #FFFFFF;
      font-family: 'Jua', sans-serif;
      font-size: 26px;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 158, 187, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-fortune-big:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 14px 28px rgba(255, 158, 187, 0.5);
    }

    /* Screen 3: Category Selection */
    .category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .cat-btn {
      background: #FFFDFB;
      border: 2px solid #F3E2EA;
      border-radius: 22px;
      padding: 16px 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .cat-btn:hover {
      background: #FFF3F7;
      border-color: #FFA6C1;
      transform: translateY(-2px);
    }

    .cat-btn.full-width {
      grid-column: span 2;
      background: #FFF8F2;
      border-color: #F5DEC9;
    }

    .cat-btn.full-width:hover {
      background: #FFF0E3;
      border-color: #F2B880;
    }

    .cat-icon {
      font-size: 28px;
    }

    .cat-title {
      font-family: 'Jua', sans-serif;
      font-size: 17px;
      color: #5A4963;
    }

    /* Screen 4: Fortune Detail */
    .fortune-box {
      background: #FFFDF9;
      border: 2px solid #F5E4EC;
      border-radius: 26px;
      padding: 24px 20px;
      margin-bottom: 20px;
    }

    .fortune-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .fortune-header-icon {
      font-size: 30px;
    }

    .fortune-header-title {
      font-family: 'Jua', sans-serif;
      font-size: 23px;
      color: #5A4963;
    }

    .fortune-text {
      font-size: 16px;
      color: #4D4254;
      line-height: 1.85;
      white-space: pre-line;
      background: #FFF8FB;
      padding: 18px;
      border-radius: 20px;
    }

    .btn-more-cozy {
      width: 100%;
      padding: 17px;
      border: 2.5px dashed #D8CCF8;
      border-radius: 26px;
      background: #F7F4FF;
      color: #6B5CA5;
      font-family: 'Jua', sans-serif;
      font-size: 21px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-more-cozy:hover {
      background: #EFEAFF;
      border-color: #B4A2F0;
      transform: translateY(-2px);
    }

    .link-reset {
      display: block;
      margin: 14px auto 0;
      background: none;
      border: none;
      color: #9A8DA1;
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 14px;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 1단계: 닉네임 및 생일 입력 -->
    <div id="screen-input" class="screen active">
      <div class="header-emoji">🌙✨</div>
      <h1>포근한 오늘의 별자리 운세</h1>
      <p class="subtitle">닉네임과 생일을 알려주시면 다정한 별의 이야기를 들려드릴게요</p>

      <div class="input-group">
        <label class="input-label" for="nickname">어떻게 불러드릴까요? (닉네임)</label>
        <input type="text" id="nickname" class="text-input" placeholder="예: 달빛토끼, 민지, 별이" maxlength="12">
      </div>

      <div class="input-group">
        <label class="input-label">생일을 선택해 주세요</label>
        <div class="date-row">
          <select id="birth-month" class="select-input">
            <option value="">월 선택</option>
          </select>
          <select id="birth-day" class="select-input">
            <option value="">일 선택</option>
          </select>
        </div>
      </div>

      <div id="error-msg" class="error-msg"></div>

      <button class="btn-primary" onclick="startFortune()">✨ 시작하기</button>
    </div>

    <!-- 2단계: 별자리 & 성격 특징 -->
    <div id="screen-zodiac" class="screen">
      <div style="text-align: center;">
        <span class="zodiac-badge" id="user-greeting-badge">반가워요!</span>
      </div>
      <div class="zodiac-card">
        <span class="zodiac-symbol" id="zodiac-symbol">♈</span>
        <div class="zodiac-name" id="zodiac-name">양자리</div>
        <div class="zodiac-date" id="zodiac-date">3월 21일 ~ 4월 19일</div>
        <div class="trait-tags" id="zodiac-tags"></div>
        <p class="zodiac-desc" id="zodiac-desc"></p>
      </div>

      <button class="btn-fortune-big" onclick="goToCategories()">
        <span>🔮</span>
        <span>오늘의 운세</span>
        <span>✨</span>
      </button>
      <button class="link-reset" onclick="resetApp()">닉네임 · 생일 다시 입력하기</button>
    </div>

    <!-- 3단계: 운세 선택지 -->
    <div id="screen-categories" class="screen">
      <div class="header-emoji" style="font-size: 40px;">🍀</div>
      <h2 id="category-greeting" style="font-size: 24px; margin-bottom: 6px;">오늘 어떤 운세가 궁금하신가요?</h2>
      <p class="subtitle" style="margin-bottom: 20px;">보고 싶은 카드를 살짝 눌러보세요</p>

      <div class="category-grid">
        <button class="cat-btn" onclick="showFortune('love')">
          <span class="cat-icon">💕</span>
          <span class="cat-title">연애운</span>
        </button>
        <button class="cat-btn" onclick="showFortune('money')">
          <span class="cat-icon">💰</span>
          <span class="cat-title">금전운</span>
        </button>
        <button class="cat-btn" onclick="showFortune('study')">
          <span class="cat-icon">📚</span>
          <span class="cat-title">학업운</span>
        </button>
        <button class="cat-btn" onclick="showFortune('health')">
          <span class="cat-icon">🌿</span>
          <span class="cat-title">건강운</span>
        </button>
        <button class="cat-btn" onclick="showFortune('events')">
          <span class="cat-icon">🎁</span>
          <span class="cat-title">오늘 생길 수도 있는 일들</span>
        </button>
        <button class="cat-btn" onclick="showFortune('items')">
          <span class="cat-icon">🧸</span>
          <span class="cat-title">오늘 있으면 좋은 물건들</span>
        </button>
        <button class="cat-btn full-width" onclick="showFortune('feedback')">
          <span class="cat-icon">💌</span>
          <span class="cat-title">피드백 (이런 행동은 삼가주세요!)</span>
        </button>
      </div>

      <button class="link-reset" onclick="backToZodiac()">내 별자리 설명 다시 보기</button>
    </div>

    <!-- 4단계: 선택한 운세 상세 -->
    <div id="screen-detail" class="screen">
      <div class="fortune-box">
        <div class="fortune-header">
          <span class="fortune-header-icon" id="detail-icon">💕</span>
          <span class="fortune-header-title" id="detail-title">오늘의 연애운</span>
        </div>
        <div class="fortune-text" id="detail-text"></div>
      </div>

      <button class="btn-more-cozy" onclick="goToCategories()">
        <span>🌷</span>
        <span>다른 운 더보기</span>
      </button>
    </div>
  </div>

  <script>
    const monthSelect = document.getElementById('birth-month');
    const daySelect = document.getElementById('birth-day');

    for (let m = 1; m <= 12; m++) {
      const opt = document.createElement('option');
      opt.value = m;
      opt.textContent = m + '월';
      monthSelect.appendChild(opt);
    }

    for (let d = 1; d <= 31; d++) {
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d + '일';
      daySelect.appendChild(opt);
    }

    const ZODIACS = [
      {
        name: '물병자리', symbol: '♒', range: '1월 20일 ~ 2월 18일',
        tags: ['#독창적인', '#자유로운영혼', '#다정한지성'],
        desc: '남들과 다른 시선으로 세상을 바라보는 반짝이는 아이디어 뱅크예요. 친구들의 이야기를 편견 없이 잘 들어주면서도, 자신만의 소중한 가치관과 자유를 지킬 줄 아는 매력적인 사람입니다.'
      },
      {
        name: '물고기자리', symbol: '♓', range: '2월 19일 ~ 3월 20일',
        tags: ['#섬세한감성', '#따뜻한공감', '#몽글몽글상상력'],
        desc: '주변 사람들의 작은 기분 변화도 단번에 알아채는 부드럽고 다정한 마음씨를 지녔어요. 예술적 감수성과 상상력이 풍부해서 함께 있으면 마음이 포근해지는 힐링 같은 존재랍니다.'
      },
      {
        name: '양자리', symbol: '♈', range: '3월 21일 ~ 4월 19일',
        tags: ['#맑은에너지', '#솔직담백', '#용기있는도전'],
        desc: '하고 싶은 일이 생기면 망설임 없이 발걸음을 내딛는 맑고 뜨거운 에너지의 소유자예요. 뒤끝 없이 솔직하고 주변 분위기까지 환하게 밝히는 사랑스러운 리더십을 가지고 있습니다.'
      },
      {
        name: '황소자리', symbol: '♉', range: '4월 20일 ~ 5월 20일',
        tags: ['#든든한온기', '#꾸준함의힘', '#소확행장인'],
        desc: '한 번 마음을 주면 변치 않고 곁을 지켜주는 믿음직스럽고 차분한 사람이에요. 맛있는 음식, 포근한 향기처럼 일상의 작고 확실한 행복을 누구보다 잘 즐길 줄 아는 감각을 지녔습니다.'
      },
      {
        name: '쌍둥이자리', symbol: '♊', range: '5월 21일 ~ 6월 21일',
        tags: ['#재치만점', '#호기심가득', '#유쾌한대화'],
        desc: '반짝이는 호기심과 센스 있는 말솜씨로 어디서든 즐거운 웃음을 만들어내는 분위기 메이커예요. 새로운 정보와 배움을 빠르게 흡수하며 다재다능한 매력을 뽐냅니다.'
      },
      {
        name: '게자리', symbol: '♋', range: '6월 22일 ~ 7월 22일',
        tags: ['#포근한배려', '#섬세한다정함', '#내사람챙기기'],
        desc: '소중한 사람들을 세심하게 챙기고 지켜주려는 따뜻한 모성애·부성애적 감성을 가졌어요. 겉으로는 수줍어 보여도 마음이 열리면 누구보다 깊은 애정과 진심을 나누는 사람입니다.'
      },
      {
        name: '사자자리', symbol: '♌', range: '7월 23일 ~ 8월 22일',
        tags: ['#햇살같은존재', '#당당한매력', '#따뜻한의리'],
        desc: '자신감 넘치는 미소와 화끈한 배려로 주변 사람들에게 든든한 힘을 주는 햇살 같은 사람이에요. 칭찬과 응원에 약하고, 자신이 아끼는 사람에게는 아낌없이 마음을 베풉니다.'
      },
      {
        name: '처녀자리', symbol: '♍', range: '8월 23일 ~ 9월 22일',

        desc: '작은 디테일 하나도 놓치지 않고 꼼꼼하게 챙기는 깔끔하고 사려 깊은 사람이에요. 말보다 행동으로 진심을 보여주며, 주변이 어수선할 때 가장 현명하게 정돈해 주는 해결사입니다.'
      },
      {
        name: '천칭자리', symbol: '♎', range: '9월 23일 ~ 10월 22일',
        tags: ['#우아한균형', '#다정한매너', '#아름다운감각'],
        desc: '상대방을 편안하게 만드는 세련된 매너와 조화로운 성품을 지녔어요. 갈등 상황에서도 양쪽의 입장을 부드럽게 이어주며, 예쁘고 감각적인 것들을 알아보는 안목이 뛰어납니다.'
      },
      {
        name: '전갈자리', symbol: '♏', range: '10월 23일 ~ 11월 22일',
        tags: ['#깊은진심', '#예리한직관', '#반전다정함'],
        desc: '한 번 집중하면 끝까지 해내는 놀라운 몰입력과 깊은 통찰력을 가진 사람이에요. 조용하지만 강한 내면을 지녔고, 진짜 내 사람에게는 누구보다 뜨겁고 헌신적인 다정함을 보여줍니다.'
      },
      {
